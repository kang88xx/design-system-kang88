<style>
:root { --bg:#f6f9fc; --card:#fff; --ink:#0a2540; --mut:#425466; --soft:#727f96; --line:#e6ebf1; --accent:#635bff; --accent2:#533afd; --shadow:0 2px 5px -1px rgba(50,50,93,.25),0 1px 3px -1px rgba(0,0,0,.3); --shadow-lg:0 13px 27px -5px rgba(50,50,93,.25),0 8px 16px -8px rgba(0,0,0,.3); --mono:"SourceCodePro","SFMono-Regular",Menlo,monospace; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 sohne-var,"SF Pro Display",-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; -webkit-font-smoothing:antialiased }
a { color:var(--accent); text-decoration:none } a:hover { color:var(--ink) }
/* 옛 셸 규칙(header.top / nav.tabs / main 레이아웃)은 studio-shell.css 의 .as-topbar / .as-sidebar nav / .as-workspace 로 대체되었다. */
section.view { display:none } section.view.on { display:block }
h2 { font-size:26px; font-weight:400; letter-spacing:-.02em; margin:8px 0 6px } h3 { font-size:17px; font-weight:500; margin:28px 0 10px } h4 { font-size:14px; font-weight:500; margin:14px 0 6px; color:var(--mut) }
p.lead { color:var(--mut); margin:0 0 18px; max-width:820px }
.grid { display:grid; gap:14px } .g2 { grid-template-columns:repeat(auto-fill,minmax(420px,1fr)) } .g3 { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)) } .g4 { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)) } .g6 { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)) }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; box-shadow:0 1px 2px rgba(10,37,64,.04) } .card.flat { box-shadow:none }
.card video.clip { width:100%; height:auto; border-radius:6px; border:1px solid var(--line); background:#fff; display:block; margin-bottom:6px }
.card img.shot { width:100%; height:auto; border-radius:6px; border:1px solid var(--line); background:#fff; display:block }
.meta { font-size:12px; color:var(--soft); margin-top:6px; word-break:break-all } .meta b { color:var(--mut); font-weight:500 }
.tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:9999px; background:#e7eaef; color:#2c3a57; margin-right:4px } .tag.hds { background:#e8e9ff; color:#533afd } .tag.legacy { background:#ffe6ef; color:#c9256b } .tag.dark { background:#0a2540; color:#fff }
pre, code.block { font:12px/1.5 var(--mono); background:#0a2540; color:#e6ebf1; padding:12px 14px; border-radius:6px; overflow:auto; max-height:360px; white-space:pre-wrap; word-break:break-word; margin:8px 0 } code.inline { font:12px var(--mono); background:#e6ebf1; padding:1px 5px; border-radius:4px }
button.copy { font:inherit; font-size:12px; padding:4px 10px; border-radius:16.5px; border:1px solid var(--line); background:#fff; color:var(--accent); cursor:pointer } button.copy:hover { background:#f6f9fc }
details { margin-top:8px } summary { cursor:pointer; font-size:13px; color:var(--accent); font-weight:500 }
input.search, select.filter { font:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink) } .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 18px } .toolbar .count { font-size:13px; color:var(--soft) }
.sw { border-radius:6px; border:1px solid rgba(10,37,64,.08); padding:8px; min-height:74px; display:flex; flex-direction:column; justify-content:flex-end; cursor:pointer } .sw span { font:11px var(--mono); background:rgba(255,255,255,.85); color:#0a2540; padding:1px 5px; border-radius:3px; align-self:flex-start; margin-top:2px }
.swrow { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; margin-bottom:12px }
table { border-collapse:collapse; width:100%; font-size:13px; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top } th { background:#f6f9fc; font-weight:500; color:var(--mut) } td code { font:12px var(--mono) }
.type-sample { color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.frames { display:flex; gap:4px; overflow:auto } .frames img { height:90px; border:1px solid var(--line); border-radius:4px; background:#fff }
.stat { display:inline-block; margin:0 18px 10px 0 } .stat b { display:block; font-size:28px; font-weight:400; letter-spacing:-.02em; color:var(--accent2) } .stat span { font-size:12px; color:var(--soft) }
.demo { padding:20px; border:1px dashed var(--line); border-radius:8px; background:#fff; display:flex; gap:14px; flex-wrap:wrap; align-items:center } .demo.dark { background:#0a2540 }
.icon-cell { text-align:center; padding:12px 6px } .icon-cell svg { width:40px; height:40px } .icon-cell .n { font-size:10px; color:var(--soft); word-break:break-all; margin-top:6px }
.two { display:grid; grid-template-columns:1fr 1fr; gap:14px } @media (max-width:900px) { .two { grid-template-columns:1fr } }
.bar { height:10px; background:var(--accent); border-radius:2px; display:inline-block; vertical-align:middle; margin-right:8px }
.pill-list a { display:inline-block; font-size:12px; margin:2px 6px 2px 0; padding:2px 8px; border-radius:9999px; background:#e6ebf1; color:var(--mut) }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0a2540; color:#fff; padding:8px 16px; border-radius:16.5px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50 } .toast.on { opacity:1 }
</style>

<script>
const DS = window.DS; const $ = (s, r = document) => r.querySelector(s); const h = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = (p) => '../' + p;
const copy = (t) => { navigator.clipboard?.writeText(t); const x = $('#toast'); x.classList.add('on'); setTimeout(() => x.classList.remove('on'), 900); };
window.copyText = copy;
const vid = (f, extra = '') => f ? '<video class="clip" src="' + R(f) + '" autoplay muted loop playsinline preload="metadata" ' + extra + '></video>' : '';
const sys = (s) => '<span class="tag ' + h(s) + '">' + h(s) + '</span>';
const cssOf = (rules) => (rules || []).map(r => r.selector + ' {\n  ' + r.css.split(';').filter(Boolean).map(d => d.trim()).join(';\n  ') + ';\n}').join('\n\n');
const VIEWS = {
  overview: { t: '개요', r: () => { const m = DS.obs?.meta || {}; const hds = DS.pages.filter(p => p.system === 'hds').length, leg = DS.pages.filter(p => p.system === 'legacy').length; return '<div class="as-overview-title"><div class="as-eyebrow"><span class="as-status-dot"></span> WEB DESIGN SYSTEM <span class="as-version">2026.09</span></div><h1>stripe.com 디자인 소스 수집</h1><p class="lead as-intro">stripe.com 마케팅 사이트에서 수집한 토큰·타이포·박스(카드/서피스) 소스·일러스트·인터랙션·모션·이펙트 카탈로그. 두 개의 시스템이 공존합니다: 새 <b>HDS</b>(홈·Billing·Radar·About 등, <code class="inline">--hds-*</code> 토큰, <code class="inline">.hds-*</code> 컴포넌트)와 대부분의 제품 페이지가 쓰는 <b>레거시 MktRoot</b>(<code class="inline">.MktRoot</code>, <code class="inline">.theme--*</code>, <code class="inline">.flavor--*</code>).</p><div class="as-title-actions"><a class="as-button" href="#boxes">박스 소스</a><a class="as-text-command" href="https://stripe.com" target="_blank" rel="noreferrer">stripe.com <span aria-hidden="true">↗</span></a></div></div>'
    + '<div class="as-stats-strip"><div class="stat"><b>' + DS.pages.length + '</b><span>크롤 페이지 (HDS ' + hds + ' · 레거시 ' + leg + ')</span></div><div class="stat"><b>' + (DS.tokens?.counts?.light || 0) + '</b><span>HDS 토큰 (다크 오버라이드 ' + (DS.tokens?.counts?.darkOverrides || 0) + ')</span></div><div class="stat"><b>' + Object.keys(DS.legacy?.root || {}).length + '</b><span>레거시 루트 토큰 · 테마 ' + Object.keys(DS.legacy?.themes || {}).length + ' · 플레이버 ' + Object.keys(DS.legacy?.flavors || {}).length + '</span></div><div class="stat"><b>' + (DS.boxes?.items?.length || 0) + '</b><span>박스 소스 (HTML+매칭 CSS)</span></div><div class="stat"><b>' + Object.values(DS.effects?.groups || {}).reduce((a, b) => a + b.length, 0) + '</b><span>이펙트 샘플</span></div><div class="stat"><b>' + ((DS.motion?.summary?.keyframes?.hds || 0) + (DS.motion?.summary?.keyframes?.legacy || 0)) + '</b><span>@keyframes · WAAPI ' + (DS.motion?.summary?.waapiUnique || 0) + '</span></div><div class="stat"><b>' + (DS.illos?.summary?.downloaded || 0) + '</b><span>일러스트/이미지 원본 다운로드</span></div><div class="stat"><b>' + DS.icons.length + '</b><span>듀오톤 아이콘 (기존 수집)</span></div></div>'
    + '<div class="as-section-heading"><div><h2>페이지</h2></div></div><div class="grid g4">' + DS.pages.map(p => '<div class="card flat"><a href="' + R(p.shots.fold) + '" target="_blank"><img class="shot" loading="lazy" src="' + R(p.shots.fold) + '" alt=""></a><div class="meta">' + sys(p.system) + '<b>' + h(p.path) + '</b><br>' + h(p.title || '') + '</div></div>').join('') + '</div>'; } },
  colors: { t: '색상', r: () => { const t = DS.tokens; if (!t) return '데이터 없음'; const core = t.color.core; const fams = {}; for (const [k, v] of Object.entries(core)) { const f = k.replace(/-[0-9]+A?$/, '').replace(/-global.*|-transparent/, ''); (fams[f] ??= []).push([k, v]); }
    let o = '<h2>색상</h2><p class="lead">HDS core 팔레트 → semantic 토큰(light/dark) 구조. 스와치를 클릭하면 값이 복사됩니다. 레거시 시스템은 테마(.theme--Light/Dark…)와 accent, 그라데이션 flavor로 구성됩니다.</p><h3>HDS core</h3>';
    for (const [f, list] of Object.entries(fams)) o += '<h4>' + h(f) + '</h4><div class="swrow">' + list.map(([k, v]) => '<div class="sw" style="background:' + v + '" onclick="copyText(\'' + v + '\')"><span>' + h(k.replace(f + '-', '')) + '</span><span>' + h(v) + '</span></div>').join('') + '</div>';
    const sem = t.color.semantic; const groups = {}; for (const k of Object.keys(sem.light)) { const g = k.split('-')[0]; (groups[g] ??= []).push(k); }
    o += '<h3>HDS semantic (light / dark)</h3>'; for (const [g, keys] of Object.entries(groups)) { if (g === 'accentColorMode' || g === 'util') continue; o += '<h4>' + h(g) + ' (' + keys.length + ')</h4><div class="swrow">' + keys.map(k => { const l = sem.light[k].value, d = sem.dark[k]?.value; return '<div class="sw" style="background:linear-gradient(135deg,' + l + ' 50%,' + (d || l) + ' 50%)" onclick="copyText(\'--hds-color-' + k + '\')" title="light ' + h(l) + ' / dark ' + h(d) + '"><span>' + h(k.replace(g + '-', '')) + '</span><span>' + h(l) + '</span></div>'; }).join('') + '</div>'; }
    o += '<h3>HDS accent modes</h3>' + Object.entries(t.color.accents).map(([a, m]) => '<h4>.hds-accent--' + h(a) + '</h4><div class="swrow">' + Object.entries(m).map(([k, v]) => '<div class="sw" style="background:' + v.value + '"><span>' + h(k.replace('accent-', '')) + '</span><span>' + h(v.value) + '</span></div>').join('') + '</div>').join('');
    const L = DS.legacy; if (L) { o += '<h3>레거시 MktRoot 테마</h3><div class="grid g3">' + Object.entries(L.themes).map(([n, m]) => '<div class="card"><b>.theme--' + h(n) + '</b><div class="swrow" style="margin-top:8px">' + Object.entries(m).filter(([, v]) => /^#|^rgb|^hsl/.test(v)).slice(0, 18).map(([k, v]) => '<div class="sw" style="background:' + v + ';min-height:54px" onclick="copyText(\'' + v + '\')"><span>' + h(k.replace('--', '')) + '</span><span>' + h(v) + '</span></div>').join('') + '</div></div>').join('') + '</div>';
      o += '<h3>레거시 accent</h3><div class="swrow">' + Object.entries(L.accents).map(([a, m]) => '<div class="sw" style="background:' + m.light + '" onclick="copyText(\'' + m.light + '\')"><span>' + h(a) + '</span><span>' + h(m.light) + (m.dark ? ' / ' + h(m.dark) : '') + '</span></div>').join('') + '</div>';
      o += '<h3>레거시 gradient flavors (WebGL Gradient 캔버스 색)</h3><div class="grid g4">' + Object.entries(L.flavors).map(([f, m]) => { const c = ['--gradientColorZero', '--gradientColorOne', '--gradientColorTwo', '--gradientColorThree'].map(k => m[k]).filter(Boolean); return '<div class="card flat"><div style="height:70px;border-radius:6px;background:linear-gradient(-6deg,' + c.join(',') + ')"></div><div class="meta"><b>.flavor--' + h(f) + '</b><br>' + c.map(h).join(' · ') + '</div></div>'; }).join('') + '</div>'; }
    const B = DS.obs?.bySystem; if (B) o += '<h3>관측 색상 (계산된 스타일 빈도)</h3><div class="two">' + ['hds', 'legacy'].map(s => '<div class="card"><b>' + s + ' pages · text</b><div class="swrow" style="margin-top:8px">' + B[s].text.slice(0, 18).map(c => '<div class="sw" style="background:' + c.hex + ';min-height:56px" onclick="copyText(\'' + c.hex + '\')"><span>' + h(c.hex) + '</span><span>' + c.count + (c.tokens?.length ? ' · ' + h(c.tokens[0]) : '') + '</span></div>').join('') + '</div><b>background</b><div class="swrow" style="margin-top:8px">' + B[s].background.slice(0, 18).map(c => '<div class="sw" style="background:' + c.hex + ';min-height:56px" onclick="copyText(\'' + c.hex + '\')"><span>' + h(c.hex) + '</span><span>' + c.count + (c.tokens?.length ? ' · ' + h(c.tokens[0]) : '') + '</span></div>').join('') + '</div></div>').join('') + '</div>';
    return o; } },
  type: { t: '타이포', r: () => { const t = DS.tokens; if (!t) return ''; let o = '<h2>타이포그래피</h2><p class="lead">서체: <code class="inline">' + h(t.fonts.family) + '</code> (Söhne 가변 폰트, weight 1–1000, 본문 300 / 강조 400), 코드: <code class="inline">' + h(t.fonts.familyCode) + '</code>. HDS 스케일은 640px·940px 브레이크포인트에서 크기·행간·자간이 바뀝니다. 레거시는 CopyTitle/CopyBody 변형과 15px/1.6 본문, weight 300/425/500을 씁니다.</p>';
