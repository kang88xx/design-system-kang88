<section class="ri-sample" data-ri="form" data-ri-mode="production" aria-labelledby="ri-form-title"><div class="ri-shell ri-form-grid"><div class="ri-form-aside"><div><h3 class="ri-heading" id="ri-form-title">전문가 상담 폼</h3><p class="ri-copy">영상에서 문의 폼과 좌측 그래픽 구성이 관찰됩니다. 실제 적용을 위해 필수값 검증, 인라인 오류, 성공/실패/지연 상태를 같은 화면에서 재현합니다.</p></div><div class="ri-line-map" aria-hidden="true"><span class="ri-map-path"></span></div></div><form novalidate><div class="ri-field-grid"><label class="ri-field"><span class="ri-label">이름 *</span><input class="ri-input" name="name" autocomplete="name" data-ri-required required aria-required="true" aria-describedby="ri-name-error"><span class="ri-error" id="ri-name-error"></span></label><label class="ri-field"><span class="ri-label">회사 *</span><input class="ri-input" name="company" autocomplete="organization" data-ri-required required aria-required="true" aria-describedby="ri-company-error"><span class="ri-error" id="ri-company-error"></span></label><label class="ri-field ri-field-full"><span class="ri-label">이메일 *</span><input class="ri-input" name="email" type="email" autocomplete="email" data-ri-required required aria-required="true" aria-describedby="ri-email-error"><span class="ri-error" id="ri-email-error"></span></label></div><div class="ri-button-row" style="margin-top:16px"><button class="ri-button ri-button-primary" type="submit" aria-busy="false">상담 요청</button><button class="ri-button" type="reset">초기화</button></div><p class="ri-status" data-ri-form-status role="status" aria-live="polite">입력 내용을 확인한 뒤 요청을 보내세요.</p></form></div></section>
