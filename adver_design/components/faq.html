<section class="ri-sample" data-ri="faq" aria-labelledby="ri-faq-title"><div class="ri-shell"><h3 class="ri-heading" id="ri-faq-title">FAQ 아코디언</h3><p class="ri-copy">각 질문은 button으로 동작하고 펼침 상태를 aria-expanded로 제공합니다. reduced motion에서는 높이 전환을 제거합니다.</p><div class="ri-faq-list" style="margin-top:24px"><div class="ri-faq-item"><button class="ri-faq-button" type="button" data-ri-faq-button aria-expanded="true" aria-controls="ri-faq-panel-1"><span>캠페인 단계 컴포넌트는 어디에 쓰나요?</span><span class="ri-plus" aria-hidden="true">+</span></button><div class="ri-faq-panel" id="ri-faq-panel-1"><div class="ri-faq-panel-inner">목표, 대상, 소재, 학습처럼 순서가 중요한 설명을 짧은 탭 또는 단계 콘텐츠로 보여줄 때 사용합니다.</div></div></div><div class="ri-faq-item"><button class="ri-faq-button" type="button" data-ri-faq-button aria-expanded="false" aria-controls="ri-faq-panel-2"><span>한 번에 여러 항목을 열 수 있나요?</span><span class="ri-plus" aria-hidden="true">+</span></button><div class="ri-faq-panel" id="ri-faq-panel-2"><div class="ri-faq-panel-inner">이 샘플은 여러 항목을 동시에 열 수 있습니다. 제품 정책에 따라 하나만 여는 방식으로 쉽게 바꿀 수 있습니다.</div></div></div><div class="ri-faq-item"><button class="ri-faq-button" type="button" data-ri-faq-button aria-expanded="false" aria-controls="ri-faq-panel-3"><span>모션을 줄인 사용자는 어떻게 처리하나요?</span><span class="ri-plus" aria-hidden="true">+</span></button><div class="ri-faq-panel" id="ri-faq-panel-3"><div class="ri-faq-panel-inner">prefers-reduced-motion이 켜져 있으면 높이 애니메이션과 회전 모션을 즉시 상태 변경으로 대체합니다.</div></div></div></div></div></section>
