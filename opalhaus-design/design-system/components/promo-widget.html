<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opalhaus promotion widget</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="promo-widget.css">
<style>@font-face{font-family:Inter;src:url("media/a4c529c3324d-1ZFS7N918ojhhd0nQWdj3jz4w.woff2");font-weight:600;font-style:normal;font-display:swap}body{font-family:Inter,sans-serif;margin:40px}#promotion{margin:32px 0}#status{overflow-wrap:anywhere;max-width:600px}</style>
<h1>Promotion widget</h1><p>원본 크기 140 × 101px. 이 예제의 클릭은 목적지만 표시합니다.</p><div id="promotion"></div><p id="status" role="status"></p>
<script src="promo-widget.js"></script><script>
// Four reference banners are included in media/. Replace with your own images for production.
const slides = [
 {src:'media/5a443e3f6ace-voui19yhvlTrMW30lyYkvKkP2U.png',alt:'All-Access Bundle'},
 {src:'media/f4503ae1470d-Te26rQp4D0RlgnQKdAe90TZYd0.png',alt:'60+ Templates'},
 {src:'media/63ee7fa85a70-2uHrE7dNBKBOPd52Y9tOXJKt8U.png',alt:'Pay Once, Yours Forever'},
 {src:'media/5c22aea14b24-a3WP6yjGjkY8y1NygXdc9Rm4Yas.png',alt:'Access to Future Templates'}
];
const host=document.querySelector('#promotion');
const widget=OpalPromo.mount(host,{slides,href:'https://pentaclay-framer.blink.store/opalhaus-design-agency-marketing-template',bannerHref:'https://pentaclay.com',demo:true,scale:2});
host.addEventListener('opal:promo-activate',event=>document.querySelector('#status').textContent='새 탭 목적지: '+event.detail.href);
// Production: set demo:false and configure href / bannerHref with YOUR destinations.
// Optional fixed positioning: fixed:true. Teardown: widget.destroy().
</script></html>
